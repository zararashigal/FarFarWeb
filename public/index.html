<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Far Far Web</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Far Far Web - A WebUI for Far Far West Builds</h1>
      <span class="sp"></span>
      <span class="top-stat" id="soulTotal">Total: 0</span>
      <button class="btn" id="share">Copy share link</button>
      <button class="btn" id="reset">Reset</button>
    </header>
    <main>
      <section>
        <div class="ttl"><h2>Jokers</h2></div>
        <div class="filters" id="filters"></div>
        <div class="scroll" id="catalog"></div>
      </section>
      <section>
        <div class="ttl"><h2 id="railTitle">Hero</h2><span class="lv" id="railSlots"></span></div>
        <div class="tabs" id="tabs"></div>
        <div class="scroll" id="rail"></div>
      </section>
      <section>
        <div class="ttl"><h2>Stats</h2></div>
        <div class="scroll" id="stats"></div>
      </section>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
