<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Far Far Web</title>
  <meta name="description" content="Create, compare, and share Far Far West hero and weapon builds with a searchable planner for jokers, spells, upgrades, and stats.">
  <link rel="canonical" href="https://ffw.ashleyy.rip/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Far Far Web">
  <meta property="og:title" content="Far Far West Build Planner | Far Far Web">
  <meta property="og:description" content="Create, compare, and share Far Far West hero and weapon builds with a searchable planner for jokers, spells, upgrades, and stats.">
  <meta property="og:url" content="https://ffw.ashleyy.rip/">
  <meta property="og:image" content="https://raw.githubusercontent.com/zararashigal/FarFarWeb/refs/heads/main/thumb.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Far Far West Build Planner | Far Far Web">
  <meta name="twitter:description" content="Create, compare, and share Far Far West hero and weapon builds with a searchable planner for jokers, spells, upgrades, and stats.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/zararashigal/FarFarWeb/refs/heads/main/thumb.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lacquer&family=Rye&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-title">
        <img class="brand-logo" src="favicon.svg" alt="" aria-hidden="true">
        <div class="header-copy">
          <h1>Far Far Web</h1>
          <span class="byline">by <span class="byline-name">ashley orion</span></span>
        </div>
      </div>
      <span class="sp"></span>
      <div class="header-build">
        <label class="top-stat build-name">Build name: <input id="buildName" type="text" maxlength="12" autocomplete="off"></label>
        <span class="top-stat" id="soulTotal">Total: 0</span>
      </div>
      <div class="header-actions">
        <button class="btn" id="share">Copy link</button>
        <button class="btn qr-share" id="qrShare" type="button" aria-haspopup="dialog" aria-label="QR Code" title="QR Code">
          <svg class="qr-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" d="M2 2h8v8H2zM4 4v4h4V4zM14 2h8v8h-8zM16 4v4h4V4zM2 14h8v8H2zM4 16v4h4v-4z"/>
            <path d="M14 14h3v3h-3zM18 14h4v3h-4zM14 19h3v3h-3zM19 19h3v3h-3z"/>
          </svg>
        </button>
        <button class="btn" id="reset">Reset</button>
        <a class="btn header-status" href="/status">Status</a>
      </div>
    </header>
    <dialog class="qr-dialog" id="qrDialog" aria-label="Far Far Web QR code">
      <div class="qr-code" id="qrCode" hidden>
        <img id="qrImage" alt="Far Far Web build QR code">
      </div>
      <div class="err" id="qrError" role="alert" hidden></div>
    </dialog>
    <main>
      <nav class="spell-bar" id="spellSlots" aria-label="Spell slots"></nav>
      <section>
        <div class="ttl"><h2>Jokers</h2></div>
        <div class="filters" id="filters"></div>
        <div class="scroll" id="catalog"></div>
      </section>
      <section>
        <div class="ttl"><h2 id="railTitle">Hero</h2><span class="lv" id="railSlots"></span></div>
        <div class="tabs" id="tabs"></div>
        <div class="scroll" id="rail"></div>
      </section>
      <section>
        <div class="ttl"><h2>Stats</h2></div>
        <div class="scroll" id="stats"></div>
      </section>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
