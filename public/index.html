<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Far Far Web</title>
  <meta name="description" content="A WebUI for Far Far West Builds!">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Far Far Web">
  <meta property="og:description" content="A WebUI for Far Far West Builds!">
  <meta property="og:url" content="https://ffw.ashleyy.rip">
  <meta property="og:image" content="https://raw.githubusercontent.com/zararashigal/FarFarWeb/refs/heads/main/thumb.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Far Far Web">
  <meta name="twitter:description" content="A WebUI for Far Far West Builds!">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/zararashigal/FarFarWeb/refs/heads/main/thumb.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-title">
        <img class="brand-logo" src="favicon.svg" alt="" aria-hidden="true">
        <div class="header-copy">
          <h1>Far Far Web</h1>
          <span class="byline">made with
            <svg class="byline-heart" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <clipPath id="byline-heart-shape">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </clipPath>
              </defs>
              <g clip-path="url(#byline-heart-shape)">
                <path fill="#5bcefa" d="M0 0h24v4.8H0z"/>
                <path fill="#f5a9b8" d="M0 4.8h24v4.8H0z"/>
                <path fill="#fff" d="M0 9.6h24v4.8H0z"/>
                <path fill="#f5a9b8" d="M0 14.4h24v4.8H0z"/>
                <path fill="#5bcefa" d="M0 19.2h24v4.8H0z"/>
              </g>
            </svg>
            by <span class="byline-name">ashley orion</span></span>
        </div>
      </div>
      <span class="sp"></span>
      <div class="header-build">
        <label class="top-stat build-name">Build name: <input id="buildName" type="text" maxlength="12" autocomplete="off"></label>
        <span class="top-stat" id="soulTotal">Total: 0</span>
      </div>
      <div class="header-actions">
        <button class="btn" id="share">Copy share link</button>
        <button class="btn qr-share" id="qrShare" type="button" aria-haspopup="dialog">
          <svg class="qr-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" d="M2 2h8v8H2zM4 4v4h4V4zM14 2h8v8h-8zM16 4v4h4V4zM2 14h8v8H2zM4 16v4h4v-4z"/>
            <path d="M14 14h3v3h-3zM18 14h4v3h-4zM14 19h3v3h-3zM19 19h3v3h-3z"/>
          </svg>
          QR Code
        </button>
        <button class="btn" id="reset">Reset</button>
      </div>
    </header>
    <dialog class="qr-dialog" id="qrDialog" aria-labelledby="qrTitle">
      <div class="qr-dialog-header">
        <h2 id="qrTitle">QR Code</h2>
        <button class="btn" id="closeQr" type="button">Close</button>
      </div>
      <div class="qr-code" id="qrCode" hidden>
        <img id="qrImage" alt="QR code for this build">
        <img class="qr-logo" src="favicon.svg" alt="" aria-hidden="true">
      </div>
      <div class="err" id="qrError" role="alert" hidden></div>
    </dialog>
    <main>
      <nav class="spell-bar" id="spellSlots" aria-label="Spell slots"></nav>
      <section>
        <div class="ttl"><h2>Jokers</h2></div>
        <div class="filters" id="filters"></div>
        <div class="scroll" id="catalog"></div>
      </section>
      <section>
        <div class="ttl"><h2 id="railTitle">Hero</h2><span class="lv" id="railSlots"></span></div>
        <div class="tabs" id="tabs"></div>
        <div class="scroll" id="rail"></div>
      </section>
      <section>
        <div class="ttl"><h2>Stats</h2></div>
        <div class="scroll" id="stats"></div>
      </section>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
